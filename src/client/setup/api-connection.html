<?xml version="1.0" encoding="utf-8"?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:g2="null">
  <style>/* ServiceNow iframes inherit overflow:hidden — force scrollability */
        html,
        body {
            overflow-y: auto !important;
            height: auto !important;
        }
        .entrust-container {
            font-family: Arial, Helvetica, sans-serif;
            max-width: 580px;
            margin: 4px auto;
            padding: 0 24px 24px;
        }
        .form-group {
            margin-bottom: 22px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 7px;
            color: #34495e;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            height: 38px;
            padding: 8px 11px;
            border: 1px solid #b8c2cc;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: #4c86a8;
            box-shadow: 0 0 0 2px rgba(76, 134, 168, 0.12);
        }
        .form-group input::placeholder {
            color: #9ba7b2;
        }
        .form-group input[readonly] {
            background: #f3f5f7;
            color: #586773;
        }
        .hint {
            display: block;
            font-size: 12px;
            color: #7b8792;
            margin-top: 7px;
            line-height: 1.45;
        }
        .req {
            color: #c83c3c;
            margin-left: 2px;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }
        .btn {
            height: 40px;
            padding: 0 22px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-test {
            background: #1769aa;
            border: 1px solid #1769aa;
            color: #fff;
        }
        .btn-test:hover {
            background: #125b94;
            border-color: #125b94;
        }
        .btn-save-wrap {
            display: inline-block;
            cursor: not-allowed;
        }
        .btn-save-wrap button:disabled {
            pointer-events: none;
        }
        .btn-save {
            background: #28a745;
            border: 1px solid #28a745;
            color: #fff;
        }
        .btn-save:hover {
            background: #218838;
            border-color: #218838;
        }
        .btn-save:disabled {
            background: #aaa;
            border-color: #aaa;
            cursor: not-allowed;
        }
        .status {
            display: none;
            margin-top: 16px;
            padding: 11px 14px;
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.4;
        }
        .status.success {
            background: #edf7f1;
            color: #326545;
            border: 1px solid #bdddc9;
        }
        .status.error {
            background: #fdf0f0;
            color: #9b3232;
            border: 1px solid #e5bcbc;
        }</style>
  <div class="entrust-container">
    <div class="form-group">
      <label>Region
        <span class="req">*</span>
      </label>
      <select id="idv_region">
        <option value="">-- Select Region --</option>
        <option value="us">United States (US)</option>
        <option value="eu">Europe (EU)</option>
        <option value="ca">Canada (CA)</option>
      </select>
    </div>
    <div class="form-group">
      <label>Base URL
        <span class="req">*</span>
      </label>
      <input type="text" id="idv_base_url" readonly="true" placeholder="Auto-filled from region"></input>
      <div class="hint">Auto-filled based on region</div>
    </div>
    <div class="form-group">
      <label>Token URL
        <span class="req">*</span>
      </label>
      <input type="text" id="idv_token_url" readonly="true" placeholder="Auto-filled from region"></input>
      <div class="hint">Auto-filled based on region</div>
    </div>
    <div class="form-group">
      <label>Client ID
        <span class="req">*</span>
      </label>
      <input type="text" id="idv_client_id" maxlength="255" placeholder="Enter your Entrust Client ID"></input>
    </div>
    <div class="form-group">
      <label>Client Secret
        <span class="req">*</span>
      </label>
      <input type="password" id="idv_client_secret" maxlength="255" placeholder="Enter your Entrust Client Secret"></input>
    </div>
    <div id="idv_credentials_hint" class="hint" style="display: none; color: #0055a5; margin-top: 6px">Credentials are already configured. Leave blank to keep existing, or
            enter new values to update.</div>
    <div class="btn-row">
      <button class="btn btn-test" id="btn_test">Test Connection</button>
      <span class="btn-save-wrap" id="btn_save_wrap" title="Run a successful Test Connection to enable Save">
        <button class="btn btn-save" id="btn_save" disabled="true">Save</button>
      </span>
    </div>
    <div class="status" id="status_box"></div>
  </div>
  <script src="./api-connection.client.js" type="module"></script>
</j:jelly>
